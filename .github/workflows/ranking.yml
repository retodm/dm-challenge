name: Actualizar ranking

on:
  workflow_dispatch:          # botón "Run workflow" en la pestaña Actions y llamada horaria desde cron-job.org
    inputs:
      solo_probar:
        description: "Solo probar (muestra resultados, no guarda nada)"
        type: boolean
        default: false
      solo_jugador:
        description: "Probar solo un jugador (texto de su URL, p. ej. Zumito). Vacío = todos"
        type: string
        default: ""
  push:
    branches: [main]
    paths: ["trackers.json", "config.json", "scripts/**", ".github/workflows/ranking.yml"]

permissions:
  contents: write

concurrency:
  group: ranking
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      HENRIK_API_KEY: ${{ secrets.HENRIK_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Probar (sin guardar)
        if: ${{ inputs.solo_probar }}
        run: node scripts/update.mjs --dry-run --debug
        env:
          SOLO: ${{ inputs.solo_jugador }}

      - name: Obtener datos
        if: ${{ !inputs.solo_probar }}
        run: node scripts/update.mjs

      - name: Guardar ranking en el repo
        if: ${{ !inputs.solo_probar }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add data/ trackers.json config.json
          git diff --cached --quiet || git commit -m "Actualizar ranking [skip ci]"
          git pull --rebase -q && git push
