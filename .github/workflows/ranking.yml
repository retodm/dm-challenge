name: Actualizar ranking y publicar

on:
  schedule:
    - cron: "*/30 * * * *"   # cada 30 min (GitHub puede retrasarlo unos minutos)
  workflow_dispatch:          # botón "Run workflow" para forzarlo a mano
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: ranking
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm install --no-audit --no-fund

      # Usa el Google Chrome que ya trae el runner (no hace falta descargar navegadores)
      - name: Obtener datos de tracker.gg
        run: node scripts/update.mjs

      - name: Guardar ranking en el repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add data/ranking.json
          git diff --cached --quiet || git commit -m "Actualizar ranking [skip ci]"
          git push

      - name: Preparar web
        run: |
          mkdir -p _site
          cp -r index.html styles.css app.js config.json data assets _site/ 2>/dev/null || true
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
